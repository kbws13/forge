[project]
name = "kbws-forge-runtime"
version = "0.1.0"
description = "Forge coding agent framework core runtime"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "kbws13", email = "hsy040506@163.com" },
]
keywords = ["coding-agent", "agent", "runtime", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbws_forge_runtime"]

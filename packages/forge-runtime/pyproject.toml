[project]
name = "kbws-forge-runtime"
version = "0.1.0"
description = "Forge coding agent framework core runtime"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "kbws13", email = "hsy040506@163.com" },
]
keywords = ["coding-agent", "agent", "runtime", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
mcp = [
    "langchain-mcp-adapters>=0.1,<1",
    "mcp>=1.0,<3",
]
openai = [
    "langchain-openai>=1.0,<2",
]

[dependency-groups]
dev = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain-mcp-adapters>=0.1,<1",
    "langchain-openai>=1.0,<2",
    "mcp>=1.0,<3",
    "pydantic-settings>=2.10,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbws_forge_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "real_provider: calls a paid external model provider",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# load_agents 是启动期一次性目录扫描（非热路径），允许同步 pathlib 调用
"src/kbws_forge_runtime/agent/loader.py" = ["ASYNC240"]

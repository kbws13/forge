[project]
name = "kbws-forge-cli"
version = "0.1.2"
description = "Forge CLI: agent scaffolding generator"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "kbws13", email = "kbws13@163.com" },
]
keywords = ["coding-agent", "cli", "scaffold", "generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "questionary>=2.0",
    "rich>=13.7",
]

[project.scripts]
forge = "kbws_forge_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbws_forge_cli"]
# 模板目录在 packages 内，hatchling 会自动打包，无需 force-include

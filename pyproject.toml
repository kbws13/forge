# Forge monorepo（uv workspace 根，非可发布包）
[tool.uv.workspace]
members = ["packages/*"]

# 注意：kbws-forge-cli 不依赖 kbws-forge-runtime；
# 只有 cli 生成的模板项目（base-agent 等）才依赖 runtime，
# 届时在模板项目的 pyproject 里声明即可。

# 工作区共享的开发依赖
[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "real_provider: calls a paid external model provider",
]
